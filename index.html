<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 218, 243, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px 0 rgba(0, 218, 243, 0.3);
        }
        .input-focus-glow:focus-within {
            box-shadow: 0 4px 12px -2px rgba(0, 218, 243, 0.15);
        }
        body {
            background-color: #131313;
        }
        .bg-mesh {
            background: radial-gradient(circle at 50% -20%, #004f58 0%, #131313 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- Background Decorative Element -->
<div class="fixed inset-0 bg-mesh opacity-40 z-0"></div>
<!-- Top Navigation Bar (Shared Components Inspired) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-background/40 backdrop-blur-xl border-b border-primary/10">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 flex items-center justify-center bg-primary-fixed-dim rounded-lg shadow-[0_0_10px_rgba(0,218,243,0.4)]">
<span class="material-symbols-outlined text-on-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">SAIP</span>
</div>
<div class="flex items-center gap-md">
<button class="flex items-center gap-xs px-sm py-unit rounded-lg bg-surface-container-high border border-outline/20 hover:bg-primary/10 transition-colors">
<span class="font-label-caps text-label-caps text-primary">EN</span>
<span class="text-on-surface-variant opacity-30">|</span>
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-60">AR</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-container-margin pt-32 pb-lg flex flex-col flex-grow">
<!-- Welcome Section -->
<section class="mb-xl flex flex-col items-center text-center">
<div class="w-24 h-24 flex items-center justify-center bg-primary-fixed-dim rounded-2xl shadow-[0_0_30px_rgba(0,218,243,0.3)] mb-md">
<span class="material-symbols-outlined text-on-primary text-[64px]" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">SAIP</h1>
<p class="font-data-mono text-label-caps text-on-surface-variant opacity-60 mt-xs uppercase tracking-widest">Secure Artificial Intelligence Protocol</p>
</section>
<!-- Login Form -->
<div class="flex flex-col gap-lg">
<!-- Email Input -->
<div class="group">
<label class="font-label-caps text-label-caps text-primary mb-sm block">IDENTITY TOKEN / EMAIL</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant opacity-50">alternate_email</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant py-md pl-[48px] pr-md text-on-surface font-data-mono focus:ring-0 focus:border-primary-fixed-dim focus:bg-surface transition-all outline-none input-focus-glow" placeholder="user@saip.io" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="group">
<div class="flex justify-between items-end mb-sm">
<label class="font-label-caps text-label-caps text-primary block">ACCESS KEY</label>
<a class="font-label-caps text-label-caps text-on-surface-variant opacity-60 hover:text-primary transition-colors" href="#">FORGOT KEY?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant opacity-50">lock_open</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant py-md pl-[48px] pr-md text-on-surface font-data-mono focus:ring-0 focus:border-primary-fixed-dim focus:bg-surface transition-all outline-none input-focus-glow" placeholder="••••••••" type="password"/>
<button class="absolute right-md flex items-center justify-center text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Toggle -->
<div class="flex items-center gap-md">
<div class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-10 h-5 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface-variant after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:bg-primary-fixed-dim peer-checked:bg-primary/20"></div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Persistent session</span>
</div>
<!-- Login Action -->
<button class="mt-md w-full bg-primary-fixed-dim py-md rounded-xl text-on-primary font-label-caps text-label-caps flex items-center justify-center gap-sm active:scale-95 transition-transform neon-glow">
<span>ESTABLISH UPLINK</span>
<span class="material-symbols-outlined text-[18px]">terminal</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="h-[1px] flex-grow bg-primary/10"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant opacity-40">OR PROTOCOL</span>
<div class="h-[1px] flex-grow bg-primary/10"></div>
</div>
<!-- Social Login -->
<button class="w-full glass-panel py-md rounded-xl text-on-surface font-body-md flex items-center justify-center gap-md hover:bg-white/5 transition-all active:scale-95">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-caps text-label-caps">AUTH VIA GLOBAL TOKEN</span>
</button>
<!-- Footer Links -->
<footer class="mt-auto pt-xl pb-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant opacity-60">
                New operative? <a class="text-primary-fixed-dim hover:underline underline-offset-4" href="#">Register Interface</a>
</p>
</footer>
</main>
<!-- Visual Accents (Glass Cards Decorative) -->
<div class="fixed -bottom-32 -left-32 w-64 h-64 bg-primary/10 blur-[100px] rounded-full z-0"></div>
<div class="fixed -top-32 -right-32 w-64 h-64 bg-primary/5 blur-[80px] rounded-full z-0"></div>
<!-- System Status Micro-indicators -->
<div class="fixed bottom-4 left-4 z-50 flex items-center gap-sm">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></div>
<span class="font-data-mono text-[10px] text-primary tracking-widest uppercase">System Online // Node: 82-X</span>
</div>
</body></html>
